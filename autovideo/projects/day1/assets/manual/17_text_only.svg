<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景 -->
  <rect width="512" height="512" fill="#F9FAFB"/>
  
  <!-- 文档堆叠 - 底层 -->
  <g transform="translate(106, 160)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="4"/>
  </g>
  
  <!-- 文档堆叠 - 中层 -->
  <g transform="translate(86, 145)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="4"/>
  </g>
  
  <!-- 文档堆叠 - 顶层 -->
  <g transform="translate(66, 130)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="4"/>
    
    <!-- 文本行 -->
    <g fill="#9CA3AF">
      <rect x="30" y="40" width="180" height="12" rx="6"/>
      <rect x="30" y="65" width="240" height="12" rx="6"/>
      <rect x="30" y="90" width="200" height="12" rx="6"/>
      <rect x="30" y="115" width="220" height="12" rx="6"/>
      <rect x="30" y="140" width="160" height="12" rx="6"/>
    </g>
    
    <!-- ABC 字母 -->
    <g>
      <text x="150" y="200" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#3B82F6" text-anchor="middle">A</text>
      <text x="210" y="200" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#3B82F6" text-anchor="middle">B</text>
      <text x="270" y="200" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#3B82F6" text-anchor="middle">C</text>
    </g>
  </g>
  
  <!-- 禁止图标 - 图片 -->
  <g transform="translate(320, 380)">
    <circle cx="25" cy="25" r="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
    <!-- 图片图标 -->
    <rect x="12" y="15" width="26" height="20" rx="3" fill="#6B7280"/>
    <circle cx="20" cy="22" r="4" fill="#FFFFFF"/>
    <path d="M12 35 L25 25 L38 35" fill="#6B7280"/>
    <!-- 禁止斜线 -->
    <line x1="8" y1="8" x2="42" y2="42" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- 禁止图标 - 视频 -->
  <g transform="translate(390, 380)">
    <circle cx="25" cy="25" r="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
    <!-- 视频图标 -->
    <rect x="10" y="15" width="30" height="20" rx="3" fill="#6B7280"/>
    <polygon points="20,18 20,32 32,25" fill="#FFFFFF"/>
    <!-- 禁止斜线 -->
    <line x1="8" y1="8" x2="42" y2="42" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- 装饰性圆点 -->
  <circle cx="50" cy="50" r="8" fill="#DBEAFE"/>
  <circle cx="462" cy="80" r="12" fill="#FEF3C7"/>
  <circle cx="480" cy="450" r="6" fill="#D1FAE5"/>
</svg>